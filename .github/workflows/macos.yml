name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install missing runtime tools
        shell: bash
        run: |
          command -v pwsh >/dev/null || brew install --cask powershell
          command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Exercise real Mac runtime with disposable fixtures
        shell: pwsh
        run: ./.github/scripts/Test-MacOS.ps1 -DiskImage
